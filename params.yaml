preprocess:
  img_size: 224
  max_per_class: 3000  # cap for tractable CPU training; set null to use all images
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

train:
  arch: resnet18  # "resnet18" (transfer learning) or "simple_cnn" (from scratch)
  epochs: 4
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
  seed: 42
  experiment_name: cats-vs-dogs
