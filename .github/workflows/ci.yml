name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple -r requirements-api.txt
          pip install pytest==9.1.1 pyyaml==6.0.3 httpx==0.28.1

      - name: Run unit tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:${{ github.sha }} .

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:${{ github.sha }}
